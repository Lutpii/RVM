# Nginx site config for RVM running on Raspberry Pi 4.
#
# Serves the built Vue SPA (FrontEnd/dist) as static files and reverse-proxies
# everything Laravel owns (/api, the Google OAuth callback, and /storage for
# captured images) to PHP-FPM. Single origin — no CORS, no dev-proxy IP juggling.
#
# Install:
#   sudo cp deploy/nginx-rvm.conf /etc/nginx/sites-available/rvm
#   sudo ln -s /etc/nginx/sites-available/rvm /etc/nginx/sites-enabled/rvm
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# Adjust the two paths below (RVM_ROOT) and the PHP-FPM socket version to match
# your Pi before installing.

# ---- redirect plain HTTP to HTTPS ----
server {
    listen 80;
    listen [::]:80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name _;

    # Self-signed cert generated during setup — see docs/DEPLOY_RASPBERRY_PI.md.
    # Swap these two lines for Let's Encrypt paths if you set up a real domain.
    ssl_certificate     /etc/ssl/rvm/rvm-selfsigned.crt;
    ssl_certificate_key /etc/ssl/rvm/rvm-selfsigned.key;

    client_max_body_size 20M;

    # ---- Laravel-owned paths: API, Google OAuth callback, public storage ----
    location ~ ^/(api/|auth/google/callback|storage/) {
        root /home/adi/RVM/BackEnd/public;
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        root /home/adi/RVM/BackEnd/public;
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_param SCRIPT_FILENAME /home/adi/RVM/BackEnd/public/index.php;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }

    # ---- Live camera preview (MJPEG) from the AI service — proxied so the
    #      browser loads it over the same HTTPS origin (a plain <img src="http://...">
    #      to port 5000 would get blocked as mixed content on an https:// page).
    location /ai-stream {
        proxy_pass http://127.0.0.1:5000/stream;
        # /stream now requires the AI service's API key like every other route
        # (see ai_service/app.py). Nginx injects it here since a plain <img> tag
        # can't send a custom header — set this to the SAME value as
        # ai_service/.env's AI_API_KEY. Anyone who can edit this file already has
        # root on the kiosk, so this is no worse than any other server-side
        # secret in an Nginx config.
        proxy_set_header X-API-Key "REPLACE_WITH_AI_API_KEY_FROM_ai_service/.env";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        chunked_transfer_encoding off;
    }

    # ---- Vue SPA (hash-mode router — the browser never sends #/... to the
    #      server, so no history-mode fallback rewriting is needed here) ----
    root /home/adi/RVM/FrontEnd/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
