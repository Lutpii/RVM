# Render Blueprint — public web backend (Laravel API) on the free plan.
# Secrets are marked sync: false, so Render asks for them when the Blueprint is created.
services:
  - type: web
    name: rvm-backend
    runtime: docker
    plan: free
    region: singapore
    rootDir: BackEnd
    dockerfilePath: ./Dockerfile
    autoDeploy: true
    envVars:
      - key: APP_NAME
        value: RVM
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        sync: false
      - key: APP_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: TRUSTED_PROXIES
        value: "*"
      - key: LOG_CHANNEL
        value: stderr
      - key: CACHE_DRIVER
        value: file
      - key: SESSION_DRIVER
        value: file
      - key: QUEUE_CONNECTION
        value: sync
      # TiDB Cloud Starter (MySQL-compatible, TLS required)
      - key: DB_CONNECTION
        value: mysql
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "4000"
      - key: DB_DATABASE
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: MYSQL_ATTR_SSL_CA
        value: /etc/ssl/certs/ca-certificates.crt
      # No mailer that can reach real users on the free plan, so OTP is
      # skipped and mail goes to the log (admin "Send via Email" is disabled).
      - key: OTP_ENABLED
        value: "false"
      - key: MAIL_MAILER
        value: log
